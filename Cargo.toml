[workspace]
resolver = "2"
members = [
    "crates/iam-expander",
    "crates/iam-models",
    "crates/iam-collector",
    "crates/iam-graph",
    "crates/iam-grapher",
]

[workspace.dependencies]
async-trait        = "^0.1.89"
aws-config         = { version = "^1.8.18", features = ["behavior-version-latest"] }
aws-sdk-iam        = "^1.112.0"
aws-sdk-organizations  = "^1.118.0"
aws-sdk-sts            = "^1.107.0"
aws-smithy-mocks        = "^0.3.0"
aws-smithy-runtime-api  = "^1.12.3"
aws-smithy-types        = "^1.4.9"
chrono             = { version = "0.4", features = ["serde"] }
futures            = "^0.3.32"
clap               = { version = "^4.6.1", features = ["derive", "env"] }
insta              = { version = "^1.48.0", features = ["json"] }
neo4rs             = "^0.8"
pretty_assertions  = "^1.4.1"
reqwest            = { version = "^0.13", features = ["json"] }
serde              = { version = "^1.0", features = ["derive"] }
serde_json         = "^1.0"
testcontainers         = "^0.27.3"
testcontainers-modules = { version = "^0.15.0", features = ["neo4j"] }
thiserror          = "^2.0.18"
tokio              = { version = "^1.52.3", features = ["rt-multi-thread", "macros", "time"] }
tracing            = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
