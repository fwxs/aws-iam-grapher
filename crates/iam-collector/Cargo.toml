[package]
name = "iam-collector"
version = "0.2.0"
edition = "2021"

[dependencies]
async-trait  = { workspace = true }
aws-config        = { workspace = true }
aws-sdk-iam       = { workspace = true }
aws-sdk-organizations = { workspace = true }
aws-sdk-sts           = { workspace = true }
aws-smithy-types  = { workspace = true }
chrono       = { workspace = true }
iam-expander = { path = "../iam-expander" }
iam-models   = { path = "../iam-models" }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
uuid         = { version = "^1.23.3", features = ["v4"] }

[dev-dependencies]
aws-sdk-iam            = { workspace = true, features = ["test-util"] }
aws-sdk-organizations  = { workspace = true, features = ["test-util"] }
aws-sdk-sts            = { workspace = true, features = ["test-util"] }
aws-smithy-mocks       = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
chrono            = { workspace = true }
pretty_assertions = { workspace = true }
reqwest           = { workspace = true }
testcontainers    = "^0.27.3"
tokio             = { workspace = true }
