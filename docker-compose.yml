services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  grapher:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # Only NEO4J_PASSWORD is read from the environment by the CLI (clap `env`
      # attribute on --neo4j-pass). --neo4j-uri/--neo4j-user have no env binding,
      # so pass them explicitly, e.g.:
      #   docker compose run --rm grapher query --neo4j-uri bolt://neo4j:7687 ...
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
      - ./data:/import

volumes:
  neo4j_data:
