services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j_data:

# This compose file runs the Neo4j server only; `aws-iam-grapher` itself runs locally via
# `cargo run` (see README.md). If you run the CLI as a container too, prefer a mounted
# secret file over an env var for its password:
#
#   services:
#     aws-iam-grapher:
#       secrets:
#         - neo4j_pass
#       command: ["collect", "--neo4j-pass-file", "/run/secrets/neo4j_pass", ...]
#
#   secrets:
#     neo4j_pass:
#       file: ./neo4j_pass.txt
